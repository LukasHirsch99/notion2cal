[package]
name = "notion2cal"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
dotenv = "0.15.0"
icalendar = "0.17.15"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version =  "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
