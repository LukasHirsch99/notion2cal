[package]
name = "notion2cal"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
dotenv = "0.15.0"
icalendar = "0.17.15"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version =  "1.0.229", features = ["derive"] }
tokio = { version = "1.0", features = ["full", "macros", "rt-multi-thread"] }
topcoat = { version = "0.10.0", features = ["tailwind", "ui"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.9", features = [ "runtime-tokio", "postgres", "uuid", "time" ] }
uuid = { version = "1", features = ["serde"] }

[build-dependencies]
topcoat = { version = "0.10.0", default-features = false, features = ["tailwind"] }
