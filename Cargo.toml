[package]
name = "notion2cal"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
dotenv = "0.15.0"
icalendar = "0.17.15"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "http2", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version =  "1.0.229", features = ["derive"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
topcoat = { version = "0.11.0", default-features = false, features = ["asset", "cookie", "discover", "font", "font-fontsource", "icon", "router", "runtime", "serve", "session", "view", "tailwind", "ui", "icon-iconify"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "time", "json", "macros", "migrate"] }
uuid = { version = "1", features = ["serde"] }
secrecy = "0.10.3"
base64 = "0.23.1"
aes-gcm = "0.11.1"

[build-dependencies]
topcoat = { version = "0.11.0", default-features = false, features = ["tailwind", "icon-iconify"] }

[dev-dependencies]
serde_json = "1"

[profile.dev]
debug = 0
